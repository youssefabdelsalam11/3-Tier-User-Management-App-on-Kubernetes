<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            animation: fadeIn 1s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
            padding: 8px 16px;
            font-size: 0.85em;
        }

        .btn-danger:hover {
            background: #ff3838;
            transform: translateY(-1px);
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .users-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .user-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideInRight 0.5s ease;
        }

        .user-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .user-email {
            color: #636e72;
            font-size: 0.95em;
            margin-bottom: 3px;
        }

        .user-details {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.9em;
        }

        .user-detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #636e72;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #636e72;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            animation: slideInDown 0.3s ease;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #636e72;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        /* Scrollbar styling */
        .users-list::-webkit-scrollbar {
            width: 8px;
        }

        .users-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .users-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .users-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>👥 User Management System</h1>
            <p>Powered by 3-Tier Architecture (Frontend + Backend + MySQL)</p>
        </div>

        <div class="main-content">
            <!-- Add User Form -->
            <div class="card">
                <h2>➕ Add New User</h2>
                <div id="formAlert"></div>
                <form id="userForm">
                    <div class="form-group">
                        <label>👤 Full Name *</label>
                        <input type="text" id="name" required placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>📧 Email Address *</label>
                        <input type="email" id="email" required placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                        <label>📱 Phone Number</label>
                        <input type="tel" id="phone" placeholder="+1-555-0100">
                    </div>
                    <div class="form-group">
                        <label>💼 Role</label>
                        <select id="role">
                            <option value="User">User</option>
                            <option value="Developer">Developer</option>
                            <option value="Designer">Designer</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        ✨ Add User
                    </button>
                </form>
                <hr style="margin: 25px 0; border: none; border-top: 2px solid #e0e0e0;">
                <button onclick="checkHealth()" class="btn btn-secondary" style="width: 100%;">
                    🏥 Check System Health
                </button>
            </div>

            <!-- Users List -->
            <div class="card">
                <div class="stats">
                    <div class="stat-box">
                        <span class="number" id="userCount">0</span>
                        <span class="label">Total Users</span>
                    </div>
                    <div class="stat-box">
                        <span class="number" id="statusIndicator">●</span>
                        <span class="label">System Status</span>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>📋 Users Database</h2>
                    <button onclick="loadUsers()" class="btn btn-secondary">
                        🔄 Refresh
                    </button>
                </div>

                <div id="usersList" class="users-list"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';

        // Load users on page load
        window.onload = () => {
            loadUsers();
            checkHealth();
        };

        // Handle form submission
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch(`${API_URL}/api/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('success', '✅ User added successfully!');
                    document.getElementById('userForm').reset();
                    loadUsers();
                } else {
                    showAlert('error', `❌ Error: ${data.error}`);
                }
            } catch (error) {
                showAlert('error', `❌ Network error: ${error.message}`);
            }
        });

        // Load all users
        async function loadUsers() {
            const usersDiv = document.getElementById('usersList');
            usersDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading users...</p></div>';

            try {
                const response = await fetch(`${API_URL}/api/users`);
                const data = await response.json();

                if (data.error) {
                    usersDiv.innerHTML = `<div class="empty-state"><p>❌ Error: ${data.error}</p></div>`;
                    return;
                }

                document.getElementById('userCount').textContent = data.count;

                if (data.users.length === 0) {
                    usersDiv.innerHTML = `
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
              </svg>
              <h3>No users found</h3>
              <p>Add your first user using the form on the left</p>
            </div>
          `;
                    return;
                }

                let html = '';
                data.users.forEach((user, index) => {
                    html += `
            <div class="user-card" style="animation-delay: ${index * 0.1}s">
              <div class="user-info">
                <div class="user-name">${user.name}</div>
                <div class="user-email">📧 ${user.email}</div>
                <div class="user-details">
                  ${user.phone ? `<div class="user-detail-item">📱 ${user.phone}</div>` : ''}
                  <div class="user-detail-item">
                    <span class="role-badge">${user.role}</span>
                  </div>
                  <div class="user-detail-item">🕒 ${user.created_at}</div>
                </div>
              </div>
              <button onclick="deleteUser(${user.id})" class="btn btn-danger">
                🗑️ Delete
              </button>
            </div>
          `;
                });

                usersDiv.innerHTML = html;
            } catch (error) {
                usersDiv.innerHTML = `<div class="empty-state"><p>❌ Network error: ${error.message}</p></div>`;
            }
        }

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/users/${userId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('success', '✅ User deleted successfully!');
                    loadUsers();
                } else {
                    showAlert('error', `❌ Error: ${data.error}`);
                }
            } catch (error) {
                showAlert('error', `❌ Network error: ${error.message}`);
            }
        }

        // Check system health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();

                const statusIndicator = document.getElementById('statusIndicator');
                if (data.status === 'healthy') {
                    statusIndicator.style.color = '#28a745';
                    statusIndicator.textContent = '● Online';
                } else {
                    statusIndicator.style.color = '#dc3545';
                    statusIndicator.textContent = '● Offline';
                }
            } catch (error) {
                const statusIndicator = document.getElementById('statusIndicator');
                statusIndicator.style.color = '#dc3545';
                statusIndicator.textContent = '● Error';
            }
        }

        // Show alert message
        function showAlert(type, message) {
            const alertDiv = document.getElementById('formAlert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>

</html>
